name: General issue
description: Ask a question or share feedback that does not fit the other templates.
labels:
  - question
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: High-level description of your request
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Provide background information, links, or context.
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related issues or discussions
